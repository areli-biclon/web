<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天 v3 — Web</title>
<meta name="description" content="人与人实时聊天 · Cloudflare">
<style>
  :root {
    --accent: #0078d7;
    --accent-dark: #106ebe;
    --border: #e2e2e2;
    --surface: #f4f6f8;
    --text: #1b1b1b;
    --text-2: #5f5f5f;
    font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont,
      'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #fff; color: var(--text); overflow: hidden; }

  header {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
  }
  header b { font-size: 14px; }
  #status {
    margin-left: auto;
    font-size: 12px;
    display: flex; align-items: center; gap: 6px;
    color: rgba(255, 255, 255, 0.92);
  }
  #dot { width: 8px; height: 8px; background: rgba(255, 255, 255, 0.5); }
  #dot.on { background: #8fff8f; }
  #dot.busy { background: #ffe27f; }

  #panel {
    flex: none;
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .p-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  .p-label { width: 52px; font-size: 12px; color: var(--text-2); flex: none; }
  .p-input {
    flex: 1; min-width: 0;
    padding: 6px 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    color: var(--text);
  }
  .p-input:focus { border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--text-2); margin: 5px 2px 0; }

  #chat {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 0;
    background: #fff;
  }
  .msg {
    max-width: 72%;
    padding: 8px 11px;
    margin: 6px 12px;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    clear: both;
  }
  .msg .who { display: block; font-size: 11px; margin-bottom: 3px; opacity: 0.75; }
  .msg.them { float: left; background: #eff1f3; color: var(--text); border: 1px solid var(--border); }
  .msg.me { float: right; background: var(--accent); color: #fff; }
  .msg.sys { float: none; margin: 6px auto; max-width: none; text-align: center; font-size: 11px; color: var(--text-2); background: none; border: none; clear: both; }

  #inputbar {
    flex: none;
    display: flex; gap: 8px;
    padding: 10px 12px;
    background: #fff;
    border-top: 1px solid var(--border);
  }
  #msgInput { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); font-size: 13px; outline: none; font-family: inherit; }
  #msgInput:focus { border-color: var(--accent); }
  button {
    cursor: pointer;
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--accent);
    color: #fff;
    border: none;
    font-size: 12.5px;
    font-family: inherit;
    flex: none;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: #9fc4e8; cursor: not-allowed; }
</style>
</head>
<body>

  <header>
    <b>聊天</b>
    <span id="status"><span id="dot"></span><span id="statusText">初始化…</span></span>
  </header>

  <div id="panel">
    <div class="p-row">
      <span class="p-label">昵称</span>
      <input class="p-input" id="name" placeholder="留空则使用随机昵称">
    </div>
    <p class="hint">打开本页即自动进入聊天室,多人实时互通。消息经 Cloudflare 实时转发,不留存。</p>
  </div>

  <div id="chat"></div>

  <div id="inputbar">
    <input id="msgInput" placeholder="输入消息,回车发送">
    <button id="sendBtn">发送</button>
  </div>

  <script>
    (function () {
      'use strict';

      var WS_URL = 'CHANGE_ME_TO_YOUR_WORKER_URL';
      var ws = null;
      var closedByMe = false;
      var reconnectTimer = null;
      var myMids = {};
      var name = '访客' + Math.random().toString(36).slice(2, 6);

      var dot = document.getElementById('dot');
      var statusText = document.getElementById('statusText');
      var chat = document.getElementById('chat');
      var nameEl = document.getElementById('name');
      var msgInput = document.getElementById('msgInput');
      var sendBtn = document.getElementById('sendBtn');

      function str(v, max) {
        if (v === null || v === undefined) return '';
        return String(v).slice(0, max || 2000);
      }

      function setStatus(txt, cls) {
        statusText.textContent = str(txt);
        dot.className = cls || '';
      }

      function log(from, text, mine) {
        var d = document.createElement('div');
        if (mine === null) {
          d.className = 'msg sys';
          d.textContent = str(text);
        } else {
          d.className = 'msg ' + (mine ? 'me' : 'them');
          if (!mine) {
            var who = document.createElement('span');
            who.className = 'who';
            who.textContent = str(from, 20);
            d.appendChild(who);
          }
          var body = document.createElement('span');
          body.textContent = str(text);
          body.style.whiteSpace = 'pre-wrap';
          d.appendChild(body);
        }
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
      }

      function wsUrl() {
        var u = WS_URL.trim().replace(/\/+$/, '');
        if (!u || u.indexOf('CHANGE_ME') !== -1) return null;
        return u.replace(/^http/, 'ws') + '/ws';
      }

      function connect() {
        var u = wsUrl();
        if (!u) {
          setStatus('未配置 Worker 地址', 'busy');
          return;
        }
        setStatus('连接中…', 'busy');
        var s = new WebSocket(u);
        ws = s;
        closedByMe = false;
        s.onopen = function () {
          setStatus('已连接', 'on');
          if (s !== ws) return;
        };
        s.onmessage = function (e) {
          if (s !== ws) return;
          if (typeof e.data !== 'string') return;
          var d;
          try { d = JSON.parse(e.data); } catch (err) { return; }
          if (!d || typeof d !== 'object') return;
          if (d.mid && myMids[d.mid]) return;
          if (d.type === 'msg') log(str(d.from), str(d.text), false);
          else if (d.type === 'sys') log('', d.text, null);
        };
        s.onclose = function () {
          if (s !== ws) return;
          if (!closedByMe) {
            setStatus('已断开,3 秒后重连…', 'busy');
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connect, 3000);
          } else {
            setStatus('已停止', '');
          }
        };
        s.onerror = function () {
          if (s !== ws) return;
          setStatus('网络错误', 'busy');
        };
      }

      function send() {
        var t = str(msgInput.value).trim();
        if (!t) return;
        if (!ws || ws.readyState !== 1) {
          log('', '尚未连接,无法发送', null);
          setStatus('尚未连接', 'busy');
          return;
        }
        var val = nameEl.value.trim();
        if (val) name = val.slice(0, 20);
        var mid = String(Date.now()) + '-' + Math.random().toString(36).slice(2, 7);
        myMids[mid] = 1;
        ws.send(JSON.stringify({ type: 'msg', from: name, text: t, mid: mid }));
        log('', t, true);
        msgInput.value = '';
      }

      sendBtn.onclick = send;
      msgInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });

      setStatus('连接中…', 'busy');
      connect();
    })();
  </script>
</body>
</html>
