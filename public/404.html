<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面不存在</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: #0B0E14; color: #EDEFF7;
    font-family: 'Noto Sans SC', 'Space Grotesk', sans-serif; text-align: center; padding: 24px;
    background-image:
      radial-gradient(50rem 34rem at 80% -10%, rgba(255, 122, 69, 0.14), transparent 60%),
      radial-gradient(44rem 30rem at -10% 40%, rgba(255, 197, 61, 0.07), transparent 60%);
  }
  .code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(88px, 20vw, 160px); font-weight: 700; line-height: 1; letter-spacing: -.03em;
    background: linear-gradient(110deg, #FF7A45 20%, #FFC53D 70%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin-top: 18px; color: #9AA3B5; font-size: 16px; line-height: 1.7; }
  a {
    display: inline-block; margin-top: 32px; padding: 12px 28px; border-radius: 999px;
    text-decoration: none; font-weight: 600; font-size: 15px; color: #140A05;
    background: linear-gradient(120deg, #FF7A45, #FFC53D);
    box-shadow: 0 4px 24px rgba(255, 122, 69, 0.35);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255, 122, 69, 0.5); }
</style>
</head>
<body>
<div>
  <div class="code">404</div>
  <p>页面不存在或已被移动</p>
  <a href="/">返回首页</a>
</div>
</body>
</html>
