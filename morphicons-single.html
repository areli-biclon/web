<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morphicons 图标变形演示 · 单文件</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #8b5cf6;
    --accent2: #3b82f6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Microsoft YaHei', sans-serif;
    font-synthesis: none;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); padding: 48px 16px 80px; }
  .app { max-width: 820px; margin: 0 auto; text-align: center; }
  h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { color: var(--muted); margin: 10px 0 32px; }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 48px;
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 20px;
    min-height: 200px;
    justify-content: center;
  }
  #stage { width: 96px; height: 96px; color: var(--accent); }
  .stage-label {
    font-family: ui-monospace, Consolas, monospace;
    color: var(--muted);
    font-size: 0.9rem;
    background: rgba(148, 163, 184, 0.1);
    padding: 4px 12px;
    border-radius: 999px;
  }
  .controls {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    margin-bottom: 40px;
  }
  .controls fieldset {
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .controls legend { font-size: 0.8rem; color: var(--muted); padding: 0 6px; }
  .seg { display: flex; gap: 6px; }
  button {
    font-family: inherit;
    cursor: pointer;
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(148, 163, 184, 0.08);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 0.9rem;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button.active,
  button.on {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }
  h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
    gap: 10px;
  }
  .icon-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 6px 10px;
    border-radius: 14px;
  }
  .icon-btn morph-icon { color: var(--muted); transition: color 0.15s; }
  .icon-btn:hover morph-icon { color: var(--text); }
  .icon-btn.current {
    border-color: var(--accent);
    background: rgba(139, 92, 246, 0.15);
  }
  .icon-btn.current morph-icon { color: var(--accent); }
  .icon-btn span { font-size: 0.72rem; color: var(--muted); }
  .hint { margin-top: 28px; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
  <div class="app">
    <h1>Morphicons 图标变形演示</h1>
    <p class="sub">任意两个图标之间平滑形变 · spring 弹簧物理 · 单文件无依赖</p>

    <div class="stage">
      <morph-icon id="stage" spring="snappy" stroke-width="1.5" label="当前图标"></morph-icon>
      <div class="stage-label" id="stageLabel">Sun</div>
    </div>

    <div class="controls">
      <fieldset>
        <legend>弹簧手感</legend>
        <div class="seg" id="presets"></div>
      </fieldset>
      <fieldset>
        <legend>描边宽度</legend>
        <div class="seg" id="strokes"></div>
      </fieldset>
      <button id="autoBtn" class="on">自动演示: 开</button>
    </div>

    <h2>点击任意图标, morph 到它</h2>
    <div class="grid" id="grid"></div>
    <p class="hint">上方舞台会从当前图标平滑形变到点击的图标;单文件所有逻辑内联,可离线双击打开。</p>
