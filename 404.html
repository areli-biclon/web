<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - 页面不存在</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0; overflow: hidden; position: relative;
  }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.45; z-index: 0; }
  .orb-1 { width: 480px; height: 480px; background: #3b82f6; top: -160px; left: -120px; }
  .orb-2 { width: 420px; height: 420px; background: #8b5cf6; bottom: -180px; right: -100px; }
  .container { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 640px; }
  .code {
    font-size: clamp(6rem, 20vw, 12rem); font-weight: 800; line-height: 1;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    user-select: none;
  }
  .title { margin: 1.5rem 0 0.75rem; font-size: 1.75rem; font-weight: 700; color: #f1f5f9; }
  .desc { font-size: 1rem; line-height: 1.7; color: #94a3b8; }
  .actions { margin-top: 2.5rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 0.7rem 1.8rem; border-radius: 10px;
    font-size: 0.95rem; font-weight: 600; text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff;
    box-shadow: 0 4px 18px rgba(59, 130, 246, 0.35);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45); }
  .btn-ghost {
    background: rgba(148, 163, 184, 0.1); color: #cbd5e1;
    border: 1px solid rgba(148, 163, 184, 0.25);
  }
  .btn-ghost:hover { transform: translateY(-2px); background: rgba(148, 163, 184, 0.18); }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <main class="container">
    <div class="code">404</div>
    <h1 class="title">页面不存在</h1>
    <p class="desc">
      抱歉，您访问的页面可能已被移除、改名或暂时不可用。<br>
      请检查网址是否正确。
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">返回首页</a>
      <button class="btn btn-ghost" onclick="history.back()">返回上一页</button>
    </div>
  </main>
</body>
</html>
