<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web — 主页</title>
<meta name="description" content="个人网页集合">
<style>
  :root {
    --bg: #eef0f2;
    --surface: #fafafa;
    --surface-2: #f2f2f2;
    --border: #e2e2e2;
    --text: #1b1b1b;
    --text-2: #5f5f5f;
    --accent: #0067c0;
    --accent-soft: #cfe6f5;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
    font-family: 'Segoe UI Variable', 'Segoe UI', -apple-system, BlinkMacSystemFont,
      'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  /* ---------- window frame ---------- */
  .window {
    width: 100%;
    max-width: 720px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }
  .titlebar {
    display: flex;
    align-items: center;
    height: 38px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    user-select: none;
  }
  .titlebar .title { font-size: 12px; color: var(--text-2); flex: 1; }
  .tb-clock {
    font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums;
    padding-right: 10px;
  }
  .titlebar .dot { width: 12px; height: 12px; border-radius: 0; margin-left: 8px; }
  .dot.min { background: #f3b48c; }
  .dot.max { background: #f6dd8a; }
  .dot.close { background: #f2a4a0; }

  /* ---------- content ---------- */
  .content { padding: 40px 40px 36px; }
  .head h1 { font-size: 34px; font-weight: 600; letter-spacing: -0.3px; }
  .head p { margin-top: 8px; font-size: 13.5px; color: var(--text-2); }

  /* start-style tile grid */
  .grid {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .tile {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
    padding: 14px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 0;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.12s, box-shadow 0.12s, transform 0.12s;
  }
  .tile:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow);
    transform: translateY(-1px);
  }
  .tile .icon {
    width: 42px; height: 42px;
    border-radius: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tile .icon svg { width: 24px; height: 24px; }
  .tile .name { font-size: 13px; font-weight: 500; }
  .tile .desc { font-size: 11.5px; color: var(--text-2); line-height: 1.5; }

  /* tile icon tints (flat, low saturation) */
  .t-blue  { background: #dbe9f6; }
  .t-red   { background: #f6dcd7; }
  .t-amber { background: #f6ecd2; }
  .t-green { background: #d9ede0; }
  .t-gray  { background: #e8e8e6; }
  .t-blue svg  { color: #2b6cb0; }
  .t-red svg   { color: #b0553f; }
  .t-amber svg { color: #a8862f; }
  .t-green svg { color: #3f8455; }
  .t-gray svg  { color: #6b6b6b; }

  .foot-note {
    margin-top: 28px;
    font-size: 11.5px;
    color: var(--text-2);
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 480px) {
    .content { padding: 24px 20px; }
    .grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

  <div class="window">
    <div class="titlebar">
      <span class="title">Web · 主页</span>
      <span class="tb-clock" id="clock">--:--</span>
      <span class="dot dot-min"></span>
      <span class="dot dot-max"></span>
      <span class="dot dot-close"></span>
    </div>

    <div class="content">
      <div class="head">
        <h1>Web</h1>
        <p>个人网页集合 · 扁平化主页</p>
      </div>

      <div class="grid">
        <a class="tile" href="/web/morphicons-single.html">
          <span class="icon t-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9l-3-3M21 8l-3 3-3-3"/><path d="M3 16h9l-3-3M21 16l-3-3-3 3"/></svg>
          </span>
          <span class="name">Morphicons 演示</span>
          <span class="desc">图标平滑形变 · 单文件离线可用</span>
        </a>

        <a class="tile" href="https://github.com/areli-biclon/web">
          <span class="icon t-gray">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
          </span>
          <span class="name">GitHub</span>
          <span class="desc">areli-biclon/web · 源码与部署</span>
        </a>
      </div>

      <p class="foot-note">基于 GitHub Pages · Cloudflare 亦可托管 · Windows Fluent 风格</p>
    </div>
  </div>

  <script>
    (function () {
      var el = document.getElementById('clock');
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      var tick = function () {
        var d = new Date();
        el.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
      };
      tick();
      setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
